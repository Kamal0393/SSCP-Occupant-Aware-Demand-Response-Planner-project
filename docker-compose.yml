services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sscp_user
      POSTGRES_PASSWORD: sscp_pass
      POSTGRES_DB: sscp_dr_planner
    ports:
      - "5432:5432"
    volumes:
      - sscp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sscp_user -d sscp_dr_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sscp_user:sscp_pass@db:5432/sscp_dr_planner
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sscp_pgdata:
