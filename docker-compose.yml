services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sscp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sscp_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sscp_dr_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sscp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sscp_user}:${POSTGRES_PASSWORD:-sscp_local_dev}@db:5432/${POSTGRES_DB:-sscp_dr_planner}
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OVERRIDE_AUTH_TOKEN: ${OVERRIDE_AUTH_TOKEN:-}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}","http://127.0.0.1:${FRONTEND_PORT:-8080}","http://localhost:5173","http://127.0.0.1:5173"]'
    command: ["sh", "-c", "python -m app.infrastructure.data_generation && exec uvicorn app.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend/operator-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sscp_pgdata:
